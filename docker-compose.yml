services:
  postgres:
    image: postgres:17-alpine
    container_name: lightrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lightrag
    ports:
      - "5432:5432"
    volumes:
      - lightrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lightrag_pgdata:
